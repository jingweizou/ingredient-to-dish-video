<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingredient → Dish Video</title>
  <link rel="stylesheet" href="./styles.css" />
  <script>
    async function loadScriptWithFallback(urls, timeoutMs = 8000) {
      for (const url of urls) {
        try {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            const timer = setTimeout(() => {
              s.remove();
              reject(new Error(`timeout: ${url}`));
            }, timeoutMs);

            s.src = url;
            s.async = true;
            s.onload = () => {
              clearTimeout(timer);
              resolve();
            };
            s.onerror = () => {
              clearTimeout(timer);
              reject(new Error(`failed: ${url}`));
            };
            document.head.appendChild(s);
          });
          return url;
        } catch (_) {}
      }
      throw new Error('all script sources failed or timed out');
    }

    window.__mlError = null;
    window.__mlReady = (async () => {
      try {
        await loadScriptWithFallback([
          'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js',
          'https://unpkg.com/@tensorflow/tfjs@4.20.0/dist/tf.min.js'
        ]);
        await loadScriptWithFallback([
          'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js',
          'https://unpkg.com/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js'
        ]);
        await loadScriptWithFallback([
          'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js',
          'https://unpkg.com/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'
        ]);
        return true;
      } catch (e) {
        window.__mlError = e;
        throw e;
      }
    })();
  </script>
</head>
<body>
  <main class="container">
    <h1>📸 Ingredient to Dish Planner</h1>
    <p class="sub">Take a photo of your ingredients, we suggest a dish, then output storyboard + image prompts + cooking steps (100% static, zero API cost).</p>

    <section class="card">
      <label class="label">1) 📷 Take ingredient photo</label>
      <div class="camera-wrap">
        <label for="fileInput" class="camera-btn">📸 Take Photo</label>
        <input id="fileInput" type="file" accept="image/*" capture="environment" />
        <p class="camera-hint">Point at your ingredients and snap a clear photo</p>
      </div>
      <img id="preview" class="preview" alt="ingredient preview" />
    </section>

    <section class="card">
      <label class="label">2) Detect ingredients (auto after photo)</label>
      <button id="detectBtn">Detect again</button>
      <div id="labels" class="chips"></div>
      <p id="detectMeta" class="meta"></p>
      <div class="dish-wrap">
        <label>Ingredients (auto-detected or enter manually, comma separated)</label>
        <input id="ingredientsInput" type="text" placeholder="e.g. tomato, egg, scallion" />
      </div>
      <div class="dish-wrap">
        <label>Suggested dish</label>
        <input id="dishInput" type="text" placeholder="e.g. Tomato Egg Stir-fry" />
      </div>
    </section>

    <section class="card">
      <label class="label">3) Generate static cooking plan</label>
      <div class="row">
        <select id="styleSelect">
          <option value="home" selected>Home Style</option>
          <option value="quick">Quick Meal</option>
          <option value="restaurant">Restaurant Style</option>
        </select>
        <select id="paceSelect">
          <option value="5" selected>5 scenes</option>
          <option value="8">8 scenes</option>
        </select>
        <button id="genBtn">Generate Plan</button>
      </div>
      <p id="status" class="status"></p>

      <div class="dish-wrap">
        <div class="copy-row">
          <label>Storyboard (scene-by-scene)</label>
          <button id="copyStoryboardBtn" class="ghost-btn" type="button">Copy</button>
        </div>
        <textarea id="storyboardOutput" rows="8" placeholder="Storyboard will appear here..."></textarea>
      </div>

      <div class="dish-wrap">
        <div class="copy-row">
          <label>Image prompts (for each scene)</label>
          <button id="copyPromptBtn" class="ghost-btn" type="button">Copy</button>
        </div>
        <textarea id="imagePromptOutput" rows="8" placeholder="Image prompts will appear here..."></textarea>
      </div>

      <div class="dish-wrap">
        <div class="copy-row">
          <label>Actionable cooking steps</label>
          <button id="copyStepsBtn" class="ghost-btn" type="button">Copy</button>
        </div>
        <textarea id="stepsOutput" rows="8" placeholder="Cooking steps will appear here..."></textarea>
      </div>
    </section>
  </main>

  <script src="./app.js?v=20260608-autodetect3"></script>
</body>
</html>
